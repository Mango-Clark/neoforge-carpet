name: Publish Release

on:
  workflow_call:
    inputs:
      tick_version:
        required: true
        type: string
      release_ref:
        required: true
        type: string
  push:
    branches: [1.20.1-tick]
  workflow_dispatch:
    inputs:
      tick_version:
        description: Tick release version (SemVer MAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: tick-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources and version history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Select release version
        id: version
        env:
          EVENT_NAME: ${{ inputs.tick_version != '' && 'workflow_dispatch' || github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          INPUT_TICK_VERSION: ${{ inputs.tick_version }}
        run: bash .github/scripts/check-release-version.sh

      - name: Set up JDK 21
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and run GameTests
        if: steps.version.outputs.changed == 'true'
        run: |
          chmod +x gradlew
          ./gradlew build runGameTestServer --no-daemon
          python .github/scripts/verify-gametests.py
          python .github/scripts/verify-jar.py
          python .github/scripts/test-conflict-startup.py
          python -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python .github/scripts/upstream.py check

      - name: Verify release JAR
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          jar="build/libs/neoforge-carpet-${VERSION}.jar"
          test -f "$jar"
          unzip -p "$jar" META-INF/mods.toml | grep -Fx "version=\"${VERSION}\""
          entries=$(unzip -Z1 "$jar")
          if grep -Eq '^(carpet/|dev/clark/carpet_tick/TickGameTests\.class$)' <<< "$entries"; then
            echo '::error::Release JAR contains legacy Carpet or GameTest classes'
            exit 1
          fi

      - name: Create version tag
        if: steps.version.outputs.changed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          release_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)
          if [[ -n "$remote_sha" && "$remote_sha" != "$release_sha" ]]; then
            echo "::error::${TAG} already points to another commit"
            exit 1
          fi
          if [[ -z "$remote_sha" ]]; then
            git tag "$TAG" "$release_sha"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Publish GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > build/release-draft.txt; then
            if [[ "$(cat build/release-draft.txt)" == 'true' ]]; then
              gh release upload "$TAG" "build/libs/neoforge-carpet-${VERSION}.jar" --clobber
              gh release edit "$TAG" --draft=false
            fi
            echo "${TAG} is already published"
            exit 0
          fi
          gh release create "$TAG" "build/libs/neoforge-carpet-${VERSION}.jar" \
            --verify-tag --title "$TAG" --generate-notes
      - name: Preserve release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            run/logs/
            build/reports/
