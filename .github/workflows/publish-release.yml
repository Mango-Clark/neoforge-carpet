name: Publish Release

on:
  push:
    branches: [1.20.1-tick]
  workflow_dispatch:
    inputs:
      tick_version:
        description: Tick release version (SemVer MAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: tick-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources and version history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          INPUT_TICK_VERSION: ${{ inputs.tick_version }}
        run: bash .github/scripts/check-release-version.sh

      - name: Set up JDK 21
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and run GameTests
        if: steps.version.outputs.changed == 'true'
        env:
          ORG_GRADLE_PROJECT_tick_version: ${{ inputs.tick_version || '' }}
        run: |
          chmod +x gradlew
          ./gradlew build runGameTestServer --no-daemon

      - name: Verify release JAR
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          jar="build/libs/neoforge-carpet-${VERSION}.jar"
          test -f "$jar"
          unzip -p "$jar" META-INF/mods.toml | grep -Fx "version=\"${VERSION}\""
          entries=$(unzip -Z1 "$jar")
          if grep -Eq '^(carpet/|dev/clark/carpet_tick/TickGameTests\.class$)' <<< "$entries"; then
            echo '::error::Release JAR contains legacy Carpet or GameTest classes'
            exit 1
          fi

      - name: Create version tag
        if: steps.version.outputs.changed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)
          if [[ -n "$remote_sha" && "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::${TAG} already points to another commit"
            exit 1
          fi
          if [[ -z "$remote_sha" ]]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Publish GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "${TAG} is already published"
            exit 0
          fi
          gh release create "$TAG" "build/libs/neoforge-carpet-${VERSION}.jar" \
            --verify-tag --title "$TAG" --generate-notes
