plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

group = 'neoforge_carpet_tick'
if (!(tick_version ==~ /(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)/)) {
    throw new GradleException('tick_version must use SemVer MAJOR.MINOR.PATCH')
}
version = "${carpet_version}-tick-${tick_version}"
base.archivesName = 'neoforge-carpet'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def tickLoader = providers.gradleProperty('tick_loader').getOrElse('forge')
if (!(tickLoader in ['forge', 'neoforge'])) {
    throw new GradleException('tick_loader must be forge or neoforge')
}

legacyForge {
    if (tickLoader == 'neoforge') {
        enable { neoForgeVersion = "${minecraft_version}-${neoforge_version}" }
    } else {
        version = "${minecraft_version}-${forge_version}"
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'forge.enabledGameTestNamespaces', 'minecraft'
            if (providers.gradleProperty('tick_test_run_dir').isPresent()) {
                gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('tick_test_run_dir').get())
            }
        }
    }
    mods {
        neoforge_carpet_tick {
            sourceSet(sourceSets.main)
        }
    }
}

// The first NeoForge releases retain an FML 47.1.37 userdev handler that
// searches for the FML version in the Forge JAR filename, not the NeoForge
// version. Alias only that development classpath entry; preserve its bytes
// and the actual --fml.forgeVersion. Production metadata is unaffected.
if (tickLoader == 'neoforge') {
    tasks.matching { it.name.startsWith('write') && it.name.endsWith('LegacyClasspath') }.configureEach {
        def aliasDirectory = layout.buildDirectory.dir("legacy-neoforge-classpath/${name}")
        outputs.dir(aliasDirectory)
        doLast {
            def classpathFile = outputs.files.files.find { it.name.endsWith('LegacyClasspath.txt') }
            def entries = classpathFile.readLines('UTF-8')
            if (entries.any { it.replace('\\', '/').contains('/net.neoforged.fancymodloader/loader/47.1.37/') }) {
                def original = entries.find { new File(it).name == "forge-${minecraft_version}-${neoforge_version}.jar" }
                if (original == null) throw new GradleException('Missing early NeoForge development artifact')
                def alias = new File(aliasDirectory.get().asFile, "forge-${minecraft_version}-47.1.37.jar")
                alias.parentFile.mkdirs()
                java.nio.file.Files.copy(new File(original).toPath(), alias.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                classpathFile.setText(entries.collect { it == original ? alias.absolutePath : it }.join('\n') + '\n', 'UTF-8')
            }
        }
    }
}

sourceSets.main.java.setSrcDirs(['src/tick/java'])
sourceSets.main.resources.setSrcDirs(['src/tick/resources', 'build/generated/sources/modMetadata'])

mixin {
    add sourceSets.main, 'neoforge_carpet_tick.refmap.json'
    config 'neoforge_carpet_tick.mixins.json'
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties(mod_version: project.version.toString(), minecraft_version: minecraft_version, forge_version: forge_version)
    expand(mod_version: project.version.toString(), minecraft_version: minecraft_version, forge_version: forge_version)
    from 'src/tick/templates'
    into 'build/generated/sources/modMetadata'
}

tasks.named('processResources').configure { dependsOn tasks.named('generateModMetadata') }
legacyForge.ideSyncTask tasks.named('generateModMetadata')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest.attributes('MixinConfigs': 'neoforge_carpet_tick.mixins.json')
    exclude 'dev/clark/carpet_tick/TickGameTests.class'
}
